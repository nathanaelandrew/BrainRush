<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BrainRush · Timed trivia battles</title>
    <base href="/" />
    <link rel="stylesheet" href="app.css" />
    <link rel="stylesheet" href="BrainRush.styles.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
</head>

<body>
    <div id="app">
        <div class="grid min-h-dvh place-items-center text-muted">
            <p class="flex items-center gap-3 font-mono text-sm uppercase tracking-[0.16em]">
                <span class="spinner" aria-hidden="true"></span> Loading BrainRush…
            </p>
        </div>
    </div>

    <div id="blazor-error-ui" data-nosnippet>
        <span>Something broke on our side. Reload to get back in the game.</span>
        <span><a href="" class="reload underline">Reload</a> <span class="dismiss" aria-label="Dismiss">✕</span></span>
    </div>

    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
